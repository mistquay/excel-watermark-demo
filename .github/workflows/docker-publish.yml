name: Build and publish Docker image

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Resolve lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Define image tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,prefix=branch-
            type=ref,event=tag
            type=sha,format=long

      - name: Build x64 image for verification
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: excel-watermark-smoke:amd64
          cache-from: type=gha,scope=excel-watermark-demo

      - name: Verify x64 page, upload, fonts and download
        run: python3 scripts/smoke_container.py --image excel-watermark-smoke:amd64 --platform linux/amd64

      - name: Build ARM64 image for verification
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: excel-watermark-smoke:arm64
          cache-from: type=gha,scope=excel-watermark-demo

      - name: Verify ARM64 page, upload, fonts and download
        run: python3 scripts/smoke_container.py --image excel-watermark-smoke:arm64 --platform linux/arm64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image
        id: publish
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=excel-watermark-demo
          cache-to: type=gha,scope=excel-watermark-demo,mode=max

      - name: Show published image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Published Docker image'
            echo
            echo "Image: \`$IMAGE_NAME@$IMAGE_DIGEST\`"
            echo
            echo 'Platforms: `linux/amd64`, `linux/arm64`'
            echo
            echo 'Tags:'
            printf '\n```text\n%s\n```\n' "$IMAGE_TAGS"
            echo
            echo 'Run this exact build:'
            printf '\n```sh\ndocker run -d --name excel-watermark-demo -p 18092:18092 %s@%s\n```\n' "$IMAGE_NAME" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
